[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musibot-client"
version = "0.1.0"
description = "Python client for the Musibot optical music recognition service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Light on purpose: this installs on end-user machines, alongside whatever else
# they have.
dependencies = [
    "musibot-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
musibot-core = { path = "../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["musibot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["musibot", "tests"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

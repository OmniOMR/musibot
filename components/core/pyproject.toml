[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "musibot-core"
dynamic = ["version"]
description = "Shared library and wire contract for the Musibot OMR service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# The version is read from the git tags rather than written down here, so that
# every commit builds as a distinct version — see docs/versioning-and-releases.md.
# `root` points at the repository root because setuptools-scm refuses to run from
# a subdirectory even when it can see the repository above it. `--match` and
# `tag_regex` keep this component reading its own tags only, and strip the
# `core/v` prefix off the version they yield.
[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "core/v*"]
raw-options.tag_regex = '^core/v(?P<version>\d+\.\d+\.\d+.*)$'

# `musibot` is a namespace package shared by all Musibot distributions
# (musibot.core here, musibot.api, musibot.worker_head, ... elsewhere),
# so it deliberately has no __init__.py of its own.
[tool.hatch.build.targets.wheel]
packages = ["musibot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["musibot", "tests"]
# `musibot` is a namespace package, so mypy needs to be told where the package
# root is; without this it sees this component's modules under two names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

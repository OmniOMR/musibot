[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musibot-hello-orchestrator"
version = "1.0.0"
description = "A Musibot orchestrator that recognises nothing, for testing the plumbing"
readme = "README.md"
license = "Apache-2.0"
# The floor `core` sets, and unlike a Model a Pipeline has no way around it: it
# runs inside the Orchestrator Head's own process.
requires-python = ">=3.11"
# Pillow is here to make a point as much as to read an image size: a Pipeline
# may bring dependencies of its own, and this is where they go. The
# orchestrator head does not have it and does not want it — to Musibot a File is
# opaque bytes, and knowing that some of them are a JPEG is a Pipeline's
# business. `musibot-orchestrator-head` is named but not sourced here: it is not
# on any package index, so whoever installs this has to say where it comes from
# — a path in development, a git link in deployment. See
# docs/versioning-and-releases.md.
#
# The head carries no version floor, unlike the `musibot-core>=0.1.0` that every
# other component declares. It has no `orchestrator-head/v*` tag yet, so a
# checkout builds it as something like `0.1.dev76+g44da046` — which PEP 440
# orders *below* 0.1.0, making any floor unsatisfiable and an editable install
# fail with `ResolutionImpossible`. See "When the build needs git" in
# docs/versioning-and-releases.md. Put the floor in once the head is first
# tagged; until then this orchestrator is deployed from the same commit as the
# head it runs inside anyway.
dependencies = [
    "musibot-orchestrator-head",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
musibot-hello-orchestrator = "hello_orchestrator:main"

# Siblings in this monorepo, installed from their paths so that an editable
# checkout of either is picked up here. This is uv-specific and pip ignores it.
[tool.uv.sources]
musibot-core = { path = "../../core", editable = true }
musibot-orchestrator-head = { path = "../../orchestrator-head", editable = true }

# The version is written down rather than derived from git tags, as it is for
# `models`: what a *User* pins is the *Pipeline's* version, which is a domain
# concept declared in the code, and this package version is packaging only.
[tool.hatch.build.targets.wheel]
packages = ["hello_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["hello_orchestrator", "tests"]

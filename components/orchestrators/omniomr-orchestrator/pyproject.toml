[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "musibot-omniomr-orchestrator"
dynamic = ["version"]
description = "The OmniOMR project's Musibot pipelines"
readme = "README.md"
license = "Apache-2.0"
# The floor `core` sets, and unlike a Model a Pipeline has no way around it: it
# runs inside the Orchestrator Head's own process.
requires-python = ">=3.11"
# OpenCV is the *headless* build on purpose: this runs as a service and never
# opens a window, and the ordinary `opencv-python` drags in GUI libraries that a
# VM does not have and should not need. numpy is declared although OpenCV brings
# it, because the slicing uses it directly.
#
# `musibot-orchestrator-head` is named but not sourced here: it is not on any
# package index, so whoever installs this has to say where it comes from — a
# path in development, a git link in deployment. See
# docs/versioning-and-releases.md.
dependencies = [
    "musibot-orchestrator-head>=0.1.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
musibot-omniomr-orchestrator = "omniomr_orchestrator:main"

# Siblings in this monorepo, installed from their paths so that an editable
# checkout of either is picked up here. This is uv-specific and pip ignores it.
[tool.uv.sources]
musibot-core = { path = "../../core", editable = true }
musibot-orchestrator-head = { path = "../../orchestrator-head", editable = true }

# The version is read from the git tags rather than written down here, so that
# every commit builds as a distinct version — see docs/versioning-and-releases.md.
# This is a *deployed* component, installed by pip from a git link, so a written
# version would be the trap that document describes: pip compares version strings
# and nothing else, so reinstalling a newer commit under an unchanged version
# does nothing, silently, and the VM keeps running the code it had.
#
# This number is not what a *User* pins. That is the *Pipeline's* version, which
# is configuration here and moves for different reasons — see CHANGELOG.md.
[tool.hatch.version]
source = "vcs"
raw-options.root = "../../.."
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "omniomr-orchestrator/v*"]
raw-options.tag_regex = '^omniomr-orchestrator/v(?P<version>\d+\.\d+\.\d+.*)$'

[tool.hatch.build.targets.wheel]
packages = ["omniomr_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["omniomr_orchestrator", "tests"]
# The tests share fixtures through `tests.fakes`, so mypy has to be told where
# the package root is or it sees that module under two names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

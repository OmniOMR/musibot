# RabbitMQ settings for a Musibot deployment, dropped into conf.d alongside
# the image's own 10-defaults.conf.

# Where the management UI is published, as a browser addresses it.
#
# Unlike a plain reverse proxy target, this has to be the *whole* public path
# and not just the part our nginx sees. The management UI builds its own asset
# and API URLs from this value and hands them to the browser, and the browser
# resolves them against the public origin — so anything shorter than the full
# path produces a page that loads and then fails to fetch anything.
#
# It follows that RabbitMQ then expects to be *asked* for that whole path too,
# which our nginx reconstructs: the university proxy strips /musibot before
# the request arrives, and the /rabbitmq/ location puts it back. Same shape as
# the MinIO S3 block, for a different reason — there it is a signature that
# must match, here it is a set of links.
#
# Note the consequence for the local stack: the management UI on the direct
# port moves with this setting, to http://localhost:15672/musibot/rabbitmq/.
management.path_prefix = /musibot/rabbitmq

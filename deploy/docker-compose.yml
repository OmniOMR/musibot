# Local development stack for Musibot.
#
# Brings up the infrastructure services that Musibot's own services connect to.
# The Musibot services themselves (api, orchestrators, workers) are NOT started
# here — you run them from your IDE or shell against this stack, which is what
# you want while developing them. See ./README.md.

name: musibot

services:

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"    # AMQP, for Musibot services
      - "15672:15672"  # management web UI, http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Publishes the management UI under the deployment's path prefix. Note
      # that this moves it on the direct port too — see the address table in
      # ./README.md.
      - ./rabbitmq/20-musibot.conf:/etc/rabbitmq/conf.d/20-musibot.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
      # The Console — unlike the S3 API — can be served under a base path, and
      # this is what tells it so. It then builds its own asset and redirect
      # URLs under that path instead of at the origin root.
      MINIO_BROWSER_REDIRECT_URL: http://localhost:8000/musibot/minio
    ports:
      - "9000:9000"  # S3 API, direct — for services and for unprefixed presigning
      - "9001:9001"  # console web UI, direct: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the buckets that hold Musicorpus pages. Exits
  # immediately after; a stopped `minio-init` container is expected.
  #
  # Two of them, because there are two ways to run against this stack. Reach
  # MinIO directly and pages live in `musibot-pages` under no key prefix.
  # Reach it through the proxied topology below and they live in `musibot`
  # under `s3/` — a bucket named for the deployment's URL prefix, which is
  # what makes presigned URLs survive being served from a path. See
  # ../../docs/deployment.md.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set musibot http://minio:9000 root password &&
      mc mb --ignore-existing musibot/musibot-pages &&
      mc mb --ignore-existing musibot/musibot
      "

  # --- the published topology -------------------------------------------
  #
  # These two exist so the deployment can be exercised locally, prefix and
  # all. Musibot is published under a path prefix by a proxy that is not ours
  # and that strips the prefix before forwarding, and almost everything about
  # the deployment is shaped by that: nginx's locations, the api service's
  # root_path, the bucket and key prefix, the Web UI's base path. Browsing a
  # service directly exercises none of it.
  #
  # Browse http://localhost:8000/musibot/ to use them.

  # Our nginx, running the same config file the VM runs.
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MUSIBOT_LISTEN_PORT: 80
      # The host as a browser sends it, port included — this is the value
      # presigned URLs are signed against, and nginx restores it before MinIO
      # validates the signature.
      MUSIBOT_PUBLIC_HOST: localhost:8000
      MUSIBOT_PUBLIC_PREFIX: /musibot
      MUSIBOT_WEB_ROOT: /usr/share/nginx/html
      # The api service is not started by this stack — you run it yourself —
      # so nginx reaches back out to the host for it. Note that the service
      # binds 127.0.0.1 by default, which a container cannot reach: start it
      # with `--host 0.0.0.0` for this to work. Override the address here if
      # you run it on another port.
      MUSIBOT_API_UPSTREAM: ${MUSIBOT_API_UPSTREAM:-host.docker.internal:8080}
      MUSIBOT_S3_UPSTREAM: minio:9000
      MUSIBOT_CONSOLE_UPSTREAM: minio:9001
      MUSIBOT_RABBITMQ_UPSTREAM: rabbitmq:15672
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named `default.conf.template` so the rendered result replaces the
      # image's stock default.conf, which would otherwise also answer on :80.
      - ./nginx/musibot.conf.template:/etc/nginx/templates/default.conf.template:ro
      # The Web UI bundle, if it has been built. `npm run build` in
      # components/web-ui; until then these paths 404 and the rest still works.
      - ../components/web-ui/dist:/usr/share/nginx/html:ro

  # A stand-in for the university's proxy: strips /musibot, forwards the rest.
  # Not a component of Musibot — it is here to be the thing we do not control.
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "8000:80"  # http://localhost:8000/musibot/
    volumes:
      - ./nginx/university-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  rabbitmq-data:
  minio-data:

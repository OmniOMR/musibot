# A stand-in for the university's proxy, for the local stack only.
#
# In production Musibot is published at https://<host>/musibot/ by a proxy
# that is not ours, which strips the /musibot prefix and forwards to our VM.
# Everything downstream — nginx's locations, the api service's root_path, the
# bucket and key prefix, the Web UI's base — is shaped by that one behaviour,
# and none of it is exercised by browsing our nginx directly. So the local
# stack puts this in front, and you browse http://localhost:8000/musibot/.
#
# This file has no counterpart in production. It exists to be the thing we do
# not control, so that the things we do control are tested against it.

# Websocket upgrades pass through only when the client asked for one; a
# Connection: upgrade header on an ordinary request confuses some upstreams.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    location /musibot/ {
        # The trailing slash on the target is what strips the prefix: nginx
        # replaces the part of the path that matched this location with the
        # URI given here.
        #
        # It also means nginx decodes the path and re-encodes it on the way
        # out, which is the behaviour worth emulating. A presigned URL for a
        # file named `scan ěščřž.jpg` carries `%20%C4%9B…`, and a proxy that
        # mangled that encoding would break the signature before Musibot ever
        # saw the request. nginx's round trip turns out to be byte-identical,
        # so it does not — and this is the ordinary behaviour of an ordinary
        # nginx proxy, which is the most likely thing to be in front of us.
        proxy_pass http://nginx/;
        proxy_http_version 1.1;

        # Host is passed through as the browser sent it — including the port,
        # which is part of it on a non-default port and therefore part of what
        # a presigned URL signed.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /musibot {
        return 301 /musibot/;
    }

    location / {
        return 404 "Musibot is served under /musibot/\n";
    }
}
